onboarding = false

[keys]
# Aligné sur le préfixe tmux (C-a) pour une mémoire musculaire partagée.
prefix = "ctrl+a"

# Navigation entre spaces (workspaces) : ctrl+j précédent, ctrl+k suivant.
# On garde les défauts herdr (prefix+shift+p/n, alt+up/down).
previous_workspace = ["prefix+shift+p", "alt+up", "ctrl+j"]
next_workspace = ["prefix+shift+n", "alt+down", "ctrl+k"]

[experimental]
pane_history = false

[ui]
agent_panel_scope = "all"
show_agent_labels_on_pane_borders = false

agent_panel_sort = "spaces"
[ui.sidebar.spaces]
# Lignes vides entre chaque workspace dans la sidebar (0 = collé, 1 = une ligne d'espacement).
row_gap = 1
